[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-rag-system"
version = "0.1.0"
description = "Production-grade Retrieval-Augmented Generation system with advanced features"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["rag", "llm", "retrieval", "nlp", "ai", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "torch>=2.0.0",
    "sentence-transformers>=2.2.0",
    "transformers>=4.30.0",
    "faiss-cpu>=1.7.4",
    "chromadb>=0.4.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "pypdf>=3.15.0",
    "python-docx>=1.0.0",
    "markdown>=3.4.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "tiktoken>=0.5.0",
    "rank-bm25>=0.2.2",
    "spacy>=3.6.0",
    "nltk>=3.8.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
    "tenacity>=8.2.0",
    "loguru>=0.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]

qdrant = [
    "qdrant-client>=1.6.0",
]

gpu = [
    "faiss-gpu>=1.7.4",
]

all = [
    "advanced-rag-system[dev,qdrant,gpu]",
]

[project.scripts]
rag = "rag_system.cli:app"

[project.urls]
Homepage = "https://github.com/yourusername/advanced-rag"
Documentation = "https://github.com/yourusername/advanced-rag/docs"
Repository = "https://github.com/yourusername/advanced-rag"
Issues = "https://github.com/yourusername/advanced-rag/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src/rag_system --cov-report=html --cov-report=term"
